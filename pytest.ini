[pytest]
# pytest-qt is provisioned in the flake's devShell for future QGIS-plugin UI
# tests, but no PyQt5/6/PySide binding is on PATH there (QGIS's own Qt stack
# is a separate derivation, not part of the generic python3.withPackages
# environment) - so the plugin fails to initialise and aborts the whole run
# with exit code 4 before any test runs. Disable it until a real Qt binding
# is added alongside it.
addopts = -p no:pytest-qt
